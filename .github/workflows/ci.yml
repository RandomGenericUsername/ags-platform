name: ci

# AD-23 (per-repo CI): `ags-platform` runs typecheck + tests on a STOCK runner.
# The pure gates (ports + test suite) need only Node. The desktop-stack typecheck
# needs the machine's GIR declarations and the `ags`/`gnim` packages, so it is a
# LOCAL gate (`make typecheck`), not a CI job: this repo has no self-hosted
# runner, and a queued job that never reports is worse than a documented local
# gate. This mirrors `ags-apps` (AGENTS.md §4).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pure:
    name: pure tests + typecheck (stock runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      # Pure unit tests: the ports only, no AGS, no GTK. Node's native
      # type-stripping runs the .ts files directly.
      - name: Unit tests
        run: make test
      # The same pure surface, typechecked. `types: ["node"]`, no gi://, no ags.
      - name: Pure tests typecheck
        run: make typecheck-tests


